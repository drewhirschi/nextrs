# App-level nextrs config — the single config source. `nextrs generate`
# writes .nextrs/vercel.json from the [vercel] table; cron schedules live directly on
# #[nextrs::cron] route handlers. Don't edit generated provider files by hand.

[app]
name = "react-todos"
url = "https://nextrs-react-todos.vercel.app"

[vercel]
regions = ["pdx1"]
# runtime = "vercel-rust@4.0.11"   # defaults; override only when needed
# install_command = "npm ci"
# build_command = "npm run client:prepare && cargo build --release --bin index && npm run client:build"
# git_deploys = false
# [vercel.extra]                    # non-framework Vercel keys only

# Only the export function enables the CSV dependency.
[bundles.exports]
features = ["exports"]
assets = ["resources/exports"]
