[package]
name = "react-todos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
# The hidden OpenAPI helper is still a Cargo binary, so keep the local server
# explicit for plain `cargo run -p react-todos`.
default-run = "react-todos"

[lib]
path = "src/app.rs"

[[bin]]
name = "react-todos"
path = "src/main.rs"

[[bin]]
name = "react-todos-dump-openapi"
path = ".nextrs/dump-openapi.rs"

# Vercel deployment entry (serverless function). See nextrs.toml.
[[bin]]
name = "index"
path = "api/index.rs"

[features]
default = ["exports"]
exports = ["dep:csv"]

[build-dependencies]
# Depends on the published crate so this example builds and deploys standalone.
# Inside this repo's workspace, a `[patch]` in the root Cargo.toml redirects it
# to the local source.
# `tsx` pulls in rolldown to bundle page.tsx; `build` is the registry/seed codegen.
nextrs = { version = "0.6.1", features = ["build", "tsx"] }

[dependencies]
csv = { version = "1", optional = true }
# `vercel` enables StreamingVercelLayer for the deploy entry; harmless locally.
# `admin` enables background jobs (app/jobs/<name>/job.rs + /__nx/jobs), request
# log capture (nextrs::logs), and the /__nx/admin dashboards; `libsql` stores
# jobs and logs in Turso when NEXTRS_DB_URL / TURSO_DATABASE_URL is set;
# `realtime` pushes todo changes to every open tab (src/live.rs).
nextrs = { version = "0.6.1", features = ["vercel", "admin", "libsql", "realtime"] }
# The todo store (src/core/todos.rs) uses the same Turso database in production.
libsql = { version = "0.10.0-pre.4", default-features = false, features = ["remote", "tls"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
vercel_runtime = { version = "2", features = ["axum"] }
askama = "0.15"
http = "1"
serde = { version = "1", features = ["derive"] }
utoipa = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
