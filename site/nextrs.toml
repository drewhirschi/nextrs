# The docs site is a nextrs app too: vercel.json is generated from this file
# and `nextrs deploy --root site` ships it. build_from = ".." because the
# Vercel project is rooted one level up (its Root Directory points here).

[app]
name = "nextrs-docs"
url = "https://nextrs.hirschi.dev"

[vercel]
regions = ["pdx1"]
build_from = ".."
