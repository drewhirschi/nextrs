# CI for nextrs. Exists because of
# docs/postmortems/2026-07-11-docs-site-dead-landing.md — a green local build
# shipped a dead docs landing. Four layers of defense run here:
#   1. cargo tests (incl. the bundler's unresolved-bare-import guard test)
#   2. root-level client generation, declaration emission, and typechecking
#   3. real builds of both apps with bundling ON
#   4. a headless-browser smoke over every route of both apps (e2e/smoke.mjs)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application and e2e dependencies
        run: |
          npm ci --prefix site
          npm ci --prefix examples/react-todos
          npm ci --prefix e2e

      # Each application-root script owns OpenAPI dumping, Orval, the Rust
      # rebuild, and JS/declaration emission for its hidden workspace package.
      - name: Generate typed clients
        run: |
          npm run client:generate --prefix site
          npm run client:generate --prefix examples/react-todos

      - name: Generated contracts and package outputs are fresh
        run: |
          test -s site/.nextrs/openapi.json
          test -s site/.nextrs/client/dist/index.js
          test -s site/.nextrs/client/dist/index.d.ts
          test -s site/.nextrs/client/dist/react-query.js
          test -s site/.nextrs/client/dist/react-query.d.ts

          test -s examples/react-todos/.nextrs/openapi.json
          test -s examples/react-todos/.nextrs/client/dist/index.js
          test -s examples/react-todos/.nextrs/client/dist/index.d.ts
          test -s examples/react-todos/.nextrs/client/dist/react-query.js
          test -s examples/react-todos/.nextrs/client/dist/react-query.d.ts

          # The materialized package is generated state and must stay ignored.
          # Only the small framework template that recreates it is tracked.
          for app in site examples/react-todos; do
            git check-ignore -q "$app/.nextrs/openapi.json"
            git check-ignore -q "$app/.nextrs/client/dist/index.d.ts"
            git ls-files --error-unmatch "$app/.nextrs/ensure-client.mjs"
            for required in \
              package.json orval.config.ts tsconfig.json \
              src/index.ts src/react-query.ts src/nextrs-client.ts src/http-client.ts src/http-error.ts \
              scripts/normalize-esm.mjs; do
              git ls-files --error-unmatch "$app/.nextrs/template/client/$required"
            done
          done

      - name: Generated HTTP client behavior
        run: |
          node scripts/test-http-client.mjs site
          node scripts/test-http-client.mjs examples/react-todos

      - name: Generated clients resolve through root workspace links
        run: |
          test -f site/node_modules/@site/client/package.json
          test -f examples/react-todos/node_modules/@react-todos/client/package.json
          (cd site && node --input-type=module --eval \
            'await import("@site/client"); await import("@site/client/react-query")')
          (cd examples/react-todos && node --input-type=module --eval \
            'await import("@react-todos/client"); await import("@react-todos/client/react-query")')

      - name: Typecheck application and generated-client projects
        run: |
          npm run typecheck --prefix site
          npm run typecheck --prefix examples/react-todos
          examples/react-todos/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2020 examples/react-todos/tests/client-errors.ts

      - name: Workspace tests
        run: cargo test --workspace --features nextrs/build,nextrs/tsx

      - name: Install unified CLI and verify both launchers
        run: |
          cargo install --path crates/cargo-nextrs --root "$RUNNER_TEMP/nextrs-cli" --locked
          export PATH="$RUNNER_TEMP/nextrs-cli/bin:$PATH"
          nextrs --help
          cargo nextrs --help

      - name: Build apps (bundling ON)
        run: cargo build -p site -p react-todos

      - name: Separate server bundle integration smoke
        run: |
          python3 scripts/test-server-bundles.py
          cargo build -p site -p react-todos

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Browser smoke over every route
        run: node e2e/smoke.mjs

      # Nothing in the smoke hovers — the /__nx/prefetch-404-on-hover and
      # missing-chunk-preload bugs shipped invisibly until a real app hit
      # them (docs/upstream-plans/hover-preload-route.md).
      - name: Hover preload regression
        run: node e2e/hover.mjs

  deploy-docs:
    name: Deploy and verify docs from this commit
    needs: test-and-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docs-production
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check this is still the main branch head
        id: source
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping docs deployment for a superseded commit"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prebuilt deployment tools
        if: steps.source.outputs.current == 'true'
        run: |
          npm install --global vercel
          cargo install cargo-zigbuild --locked
          pip install ziglang==0.13.0
      - name: Verify credentials and link docs project
        if: steps.source.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = {'VERCEL_TOKEN': 'VERCEL_TOKEN', 'VERCEL_ORG_ID': 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID': 'VERCEL_DOCS_PROJECT_ID'}
          missing = [secret for key, secret in required.items() if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure docs-production secrets: ' + ', '.join(missing))
          Path('site/.vercel').mkdir(parents=True, exist_ok=True)
          Path('site/.vercel/project.json').write_text(json.dumps({
              'orgId': os.environ['VERCEL_ORG_ID'],
              'projectId': os.environ['VERCEL_PROJECT_ID'],
              'settings': {'rootDirectory': 'site'},
          }))
          PY
      - name: Build and deploy the checked source
        if: steps.source.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXTRS_BUILD_REVISION: ${{ github.sha }}
        run: scripts/deploy-prebuilt.sh site
      - name: Verify live docs version and revision
        if: steps.source.outputs.current == 'true'
        env:
          NEXTRS_BUILD_REVISION: ${{ github.sha }}
          NEXTRS_DOCS_URL: ${{ vars.NEXTRS_DOCS_URL || 'https://nextrs.hirschi.dev' }}
        run: node scripts/verify-docs-deploy.mjs
